<style>
  :root{
    --amarelo:  #FFE600;
    --azul:     #3483FA;
    --azul-esc: #2968C8;
    --verde:    #00A650;
    --fundo:    #EBEBEB;
    --titulo:   rgba(0,0,0,.9);
    --apoio:    rgba(0,0,0,.55);
    --linha:    rgba(0,0,0,.08);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}
  html,body{max-width:100%;overflow-x:clip;overscroll-behavior-x:none}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--fundo);
    color:var(--titulo);
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .palco{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    min-height:100vh;
    min-height:100dvh;
  }

  /* ── Card ── */
  .cartao{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.10);
    animation: cardIn .45s cubic-bezier(.22,.9,.36,1) both;
  }

  @keyframes cardIn {
    from { opacity:0; transform:translateY(24px) scale(.97); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* ── Cabeçalho amarelo ── */
  .topo{
    background: linear-gradient(160deg, #FFF176 0%, var(--amarelo) 60%, #FFD000 100%);
    padding: 36px 24px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    position:relative;
    overflow:hidden;
  }

  .topo::before {
    content:'';
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.45) 0%, transparent 60%);
    pointer-events:none;
  }

  /* Badge "EXCLUSIVO" */
  .badge{
    background:rgba(0,0,0,.12);
    color:rgba(0,0,0,.65);
    font-size:10px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:20px;
    z-index:1;
  }

  .cupom-wrap{
    position:relative;
    z-index:1;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.18));
    animation: floatIcon 3.5s ease-in-out infinite;
  }

  @keyframes floatIcon {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .cupom{display:block;width:88px;height:76px}

  /* ── Corpo ── */
  .corpo{
    padding:28px 28px 0;
    text-align:center;
  }

  .desconto-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#E8F8EE;
    color:var(--verde);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    padding:6px 14px;
    border-radius:20px;
    margin-bottom:16px;
  }

  .desconto-pill svg{ flex-shrink:0; }

  .titulo{
    font-size:23px;
    font-weight:800;
    line-height:1.22;
    letter-spacing:-.02em;
    color:var(--titulo);
  }

  .titulo b{
    color:var(--verde);
    font-weight:800;
  }

  .apoio{
    margin-top:10px;
    font-size:14px;
    line-height:1.55;
    color:var(--apoio);
    font-weight:400;
  }

  /* ── Divisor ── */
  .divisor{
    display:flex;
    align-items:center;
    gap:10px;
    margin:24px 28px 0;
    color:var(--apoio);
    font-size:12px;
    font-weight:500;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  .divisor::before,.divisor::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--linha);
  }

  /* ── Lista de benefícios ── */
  .beneficios{
    margin:16px 28px 0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13.5px;
    color:rgba(0,0,0,.72);
    font-weight:500;
  }

  .item-icon{
    width:28px;
    height:28px;
    border-radius:8px;
    background:#E8F8EE;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ── Botão ── */
  .continuar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:24px 28px calc(28px + env(safe-area-inset-bottom));
    height:54px;
    border:0;
    border-radius:12px;
    background:var(--azul);
    color:#fff;
    font:inherit;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, transform .12s ease, box-shadow .15s ease;
    box-shadow: 0 4px 14px rgba(52,131,250,.4);
    letter-spacing:.01em;
  }

  .continuar:hover{
    background:#2a72e8;
    box-shadow: 0 6px 20px rgba(52,131,250,.5);
  }

  .continuar:active{
    background:var(--azul-esc);
    transform:scale(.975);
    box-shadow: 0 2px 8px rgba(52,131,250,.3);
  }

  .continuar svg{ flex-shrink:0; }

  @media (prefers-reduced-motion:reduce){
    .cartao{ animation:none; }
    .cupom-wrap{ animation:none; }
    .continuar{ transition:none; }
    .continuar:active{ transform:none; }
  }
</style>

<script>
(function () {
  var CFG     = window.PRESELL_CONFIG || {};
  var DESTINO = CFG.destino || '/promo/jbl/index.html';
  var OFERTA  = CFG.oferta  || 'SUA-OFERTA';

  var p = new URLSearchParams(location.search);
  var val = function (k) { return (p.get(k) || '').trim(); };

  var canal = window._CHANNEL || (function () {
    var forcado = (val('channel') || val('ch')).toLowerCase();
    if (forcado === 'tiktok' || forcado === 'ttk' || forcado === 'tt') return 'tiktok';
    if (forcado === 'meta' || forcado === 'fb' || forcado === 'facebook') return 'meta';

    if (val('ttclid')) return 'tiktok';
    if (val('fbclid')) return 'meta';

    var src = val('utm_source').toLowerCase();
    if (src.indexOf('tiktok') >= 0 || src.indexOf('ttk') >= 0) return 'tiktok';
    if (src.indexOf('facebook') >= 0 || src.indexOf('instagram') >= 0 ||
        src.indexOf('meta') >= 0 || src === 'fb' || src === 'ig') return 'meta';

    try {
      if (localStorage.getItem('ttclid'))  return 'tiktok';
      if (localStorage.getItem('_fbclid')) return 'meta';
    } catch (e) {}

    return 'meta';
  })();
  window._CHANNEL = canal;

  var SERVIDOR = canal === 'tiktok'
    ? 'https://tiktok-tracking.onrender.com'
    : 'https://meta-tracking-hrir.onrender.com';

  var LOCAL = location.protocol === 'file:' ||
    /^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.)/.test(location.hostname);

  var QS_KEY = '_presell_qs';
  var entrada = location.search.replace(/^\?/, '');
  try {
    if (entrada) sessionStorage.setItem(QS_KEY, entrada);
    else entrada = sessionStorage.getItem(QS_KEY) || '';
  } catch (e) {}

  try {
    if (val('ttclid')) localStorage.setItem('ttclid', val('ttclid'));
    if (val('fbclid')) { localStorage.setItem('fbclid', val('fbclid')); localStorage.setItem('_fbclid', val('fbclid')); }
  } catch (e) {}

  function destinoFinal() {
    var u;
    try { u = new URL(DESTINO, location.href); }
    catch (e) { return DESTINO; }
    new URLSearchParams(entrada).forEach(function (v, k) { u.searchParams.set(k, v); });
    return u.toString();
  }

  (function () {
    var corpo = { stage: 'presell_view', funnel: OFERTA, offer: OFERTA };
    if (LOCAL) { console.log('[presell] ambiente local — evento NÃO enviado:', SERVIDOR, corpo); return; }
    fetch(SERVIDOR + '/api/funnel/event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo),
      keepalive: true,
    }).catch(function () {});
  })();

  if (canal === 'tiktok' && !LOCAL) (function () {
    var URL_PING = SERVIDOR + '/api/funnel/ping';
    var sid;
    try {
      sid = sessionStorage.getItem('ttk_sid');
      if (!sid) {
        sid = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        sessionStorage.setItem('ttk_sid', sid);
      }
    } catch (e) {
      sid = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }
    function ping(extra) {
      var corpo = JSON.stringify(Object.assign(
        { sid: sid, funnel: OFERTA, stage: 'presell_view' }, extra || {}));
      if (extra && extra.bye && navigator.sendBeacon) {
        try { navigator.sendBeacon(URL_PING, new Blob([corpo], { type: 'application/json' })); return; } catch (e) {}
      }
      fetch(URL_PING, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: corpo, keepalive: true }).catch(function () {});
    }
    var timer = setInterval(ping, 20000);
    ping();
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { clearInterval(timer); ping({ bye: true }); }
      else { ping(); clearInterval(timer); timer = setInterval(ping, 20000); }
    });
    window.addEventListener('pagehide', function () { ping({ bye: true }); });
  })();

  function ligar(raiz) {
    var url = destinoFinal();
    (raiz || document).querySelectorAll('[data-ir]').forEach(function (el) {
      if (el.tagName === 'A') { el.setAttribute('href', url); return; }
      if (el._presellLigado) return;
      el._presellLigado = true;
      el.addEventListener('click', function (ev) { ev.preventDefault(); location.href = destinoFinal(); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { ligar(); });
  else ligar();
  new MutationObserver(function () { ligar(); }).observe(document.documentElement, { childList: true, subtree: true });

  window.PRESELL = {
    oferta:  OFERTA,
    canal:   canal,
    destino: destinoFinal,
    ligar:   ligar,
    ir:      function () { location.href = destinoFinal(); },
  };
})();
</script>
