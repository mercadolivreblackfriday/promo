[build]
  publish = "."
  functions = "netlify/functions"

# Redireciona a raiz para /promo/anti/
[[redirects]]
  from = "/"
  to = "/promo/anti/"
  status = 302

[[redirects]]
  from = "/promo"
  to = "/promo/anti/"
  status = 302

[[redirects]]
  from = "/promo/"
  to = "/promo/anti/"
  status = 302

